name: Pinned Repositories Pipeline v3

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinned-repos-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Execute Data Pipeline v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_USER: zvielkoren
        run: |
          echo "Starting Data Pipeline v3..."
          node pipeline.js
          echo "Pipeline execution complete"

      - name: Render & Inject Content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting injection engine..."
          node inject.js
          echo "Injection complete"

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage & Commit Changes
        run: |
          git add README.md
          git diff --cached --quiet
          if [ $? -eq 0 ]; then
            echo "No changes detected (idempotent)"
            exit 0
          fi
          
          git commit -m "chore: update pinned repos via pipeline v3
          
          - Executed scoring engine v3 (deterministic ranking)
          - Applied recency decay & language multipliers
          - Classified projects by system type
          - Selected top 6 repositories
          - Injected system cards into README

          [skip ci]"

      - name: Push to Repository
        if: success()
        run: |
          git push origin main