name: Update Pinned Repositories

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinned-repos
  cancel-in-progress: true

jobs:
  update-pinned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch repositories
        env:
          GH_USER: zvielkoren
        run: |
          curl -s "https://api.github.com/users/$GH_USER/repos?per_page=100" \
          | jq 'if type=="array" then . else error("Invalid API response") end' \
          > repos.json

      - name: Build ranking engine v2 (fixed)
        run: |
          cat repos.json | jq '
            map(select(.fork == false)) |
            map({
              name,
              description,
              stars: .stargazers_count,
              forks,
              updated: .updated_at
            }) |
            sort_by([-(.stars), -.forks]) |
            .[0:5] |
            map("- **\(.name)** → \(.description // "No description") (⭐\(.stars))")
          ' > pinned.txt

      - name: Inject into README
        run: |
          awk '
          /<!--PINNED_REPOS_START-->/ {
            print;
            system("cat pinned.txt");
            inside=1;
            next;
          }
          /<!--PINNED_REPOS_END-->/ {
            inside=0;
          }
          !inside
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit changes safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          git diff --cached --quiet && exit 0

          git commit -m "chore: update pinned repositories"
          git push