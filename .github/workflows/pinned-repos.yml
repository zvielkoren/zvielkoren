name: Update Pinned Repositories

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pinned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch repositories from GitHub API
        env:
          GH_USER: zvielkoren
        run: |
          curl -s "https://api.github.com/users/$GH_USER/repos?per_page=100" > repos.json

      - name: Build pinned list sorted by stars
        run: |
          cat repos.json | jq '
            map(select(.fork == false)) |
            sort_by(-.stargazers_count, -.updated_at) |
            .[0:5] |
            map("- \(.name) → \(.description // "No description")")
          ' > pinned.txt

      - name: Inject into README
        run: |
          awk '
          BEGIN {inside=1}
          /<!--PINNED_REPOS_START-->/ {
            print;
            system("cat pinned.txt");
            inside=0;
            next;
          }
          /<!--PINNED_REPOS_END-->/ {
            inside=1;
          }
          inside
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          git commit -m "chore: update pinned repositories" || exit 0
          git push
